name: Arbitrage Monitor

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run monitor for ~5.5 hours
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          TRADE_SIZE_USDC: "100"
          MIN_NET_PROFIT_USDC: "0.25"
          POLL_INTERVAL_MS: "12000"
          GAS_OVERHEAD: "100000"
          EXECUTION_COST_BUFFER_USDC: "0.02"
          SHOW_ALL: "false"
          ONCE: "false"
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: timeout 19800 npx tsx src/index.ts || true
